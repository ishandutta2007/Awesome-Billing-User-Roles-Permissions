<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Animated Style Rules -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-11px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes shimmerBorder {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .ambient-glow-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .ambient-glow-2 {
        animation: pulseGlow 8s ease-in-out 3.5s infinite;
        transform-origin: 950px 220px;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatFast 5s ease-in-out 1s infinite;
      }
      .floating-card-3 {
        animation: floatSlow 7s ease-in-out 2s infinite;
      }
      .flow-path {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .shimmer {
        animation: shimmerBorder 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle Blueprint / Grid Background -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="ambient-glow-1" cx="220" cy="180" r="140" fill="#6366f1" filter="url(#glowPurple)"/>
  <circle class="ambient-glow-2" cx="980" cy="210" r="130" fill="#0284c7" filter="url(#glowCyan)"/>

  <!-- Animated Connection Flows / Circuit Diagram (Behind text) -->
  <g fill="none" opacity="0.45">
    <path class="flow-path" d="M 120 310 C 240 260, 320 330, 440 290" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-path" d="M 760 290 C 860 330, 940 260, 1080 300" stroke="#a855f7" stroke-width="2"/>
    <path class="flow-path" d="M 880 120 C 960 90, 1040 140, 1110 110" stroke="#34d399" stroke-width="1.8"/>
  </g>

  <!-- Dynamic Role/Permission Interactive Badges (Side Floating Cards) -->
  <!-- Left Side: Role Card -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <rect x="52" y="100" width="190" height="64" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" class="shimmer"/>
    <circle cx="78" cy="132" r="14" fill="#0284c7" fill-opacity="0.3"/>
    <text x="78" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle" font-weight="bold">🛡️</text>
    <text x="102" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Finance Executive</text>
    <text x="102" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Invoices &amp; Gateways: Full</text>
  </g>

  <!-- Left Side Lower: Permission Scopes -->
  <g class="floating-card-2" filter="url(#cardShadow)">
    <rect x="70" y="235" width="180" height="60" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" class="shimmer"/>
    <circle cx="94" cy="265" r="14" fill="#059669" fill-opacity="0.3"/>
    <text x="94" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold">💳</text>
    <text x="118" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Subscription RBAC</text>
    <text x="118" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Refund Auth: Delegated</text>
  </g>

  <!-- Right Side Upper: Audit / Multi-Tenancy Card -->
  <g class="floating-card-3" filter="url(#cardShadow)">
    <rect x="945" y="95" width="200" height="64" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" class="shimmer"/>
    <circle cx="972" cy="127" r="14" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="972" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle" font-weight="bold">🔐</text>
    <text x="996" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Multi-Tenant IAM</text>
    <text x="996" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#c084fc">ReBAC / Zanzibar Matrix</text>
  </g>

  <!-- Right Side Lower: Least Privilege Policy Card -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <rect x="925" y="235" width="210" height="64" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.2" class="shimmer"/>
    <circle cx="953" cy="267" r="14" fill="#d97706" fill-opacity="0.3"/>
    <text x="953" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">⚖️</text>
    <text x="977" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Separation of Duties</text>
    <text x="977" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">SOX &amp; PCI-DSS Enforced</text>
  </g>

  <!-- FOREGROUND: TITLE, SUBTITLE & BADGES (Always on top, sharp & unhidden) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="425" y="44" width="350" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="600" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
      ⚡ ENTERPRISE RBAC &amp; BILLING IDENTITY ⚡
    </text>

    <!-- Main Title with Soft Drop Shadow -->
    <text x="602" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#000000" opacity="0.45" letter-spacing="-0.5">
      Awesome Billing User Roles &amp; Permissions
    </text>
    <text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Billing User Roles &amp; Permissions
    </text>

    <!-- Subtitle (Gradient Accent Highlight) -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" fill="#93c5fd">
      Curated Landscape of SaaS Platforms &amp; Open-Source Identity Engines
    </text>

    <!-- Tagline / Scope Description -->
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" fill="#94a3b8">
      Role Provisioning • Least-Privilege Delegation • Audit Compliance • Zanzibar &amp; Policy-as-Code
    </text>

    <!-- Tech Feature Pills at the Bottom Center -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: RBAC / ABAC -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="57" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">🔐 RBAC / ABAC</text>
      </g>
      <!-- Pill 2: SCIM 2.0 -->
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="110" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="55" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">🔄 SCIM 2.0</text>
      </g>
      <!-- Pill 3: Zanzibar ReBAC -->
      <g transform="translate(575, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="67" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">🌐 Zanzibar ReBAC</text>
      </g>
      <!-- Pill 4: Audit & SOX -->
      <g transform="translate(725, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="72" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">🛡️ SOX &amp; PCI-DSS</text>
      </g>
    </g>

    <!-- Bottom Meta Note -->
    <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">
      ⭐ Star &amp; Bookmark • Updated March 2026 • Curated for SaaS Builders &amp; Security Engineers ⭐
    </text>
  </g>
</svg>
